<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{CSRF}}"><title>Sleepysoft 入口控制台</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div><div class="eyebrow">SLEEPYSOFT · EDGE CONTROL</div><h1>入口控制台</h1></div><div class="header-actions"><span id="clock"></span><button class="quiet" id="logout">退出</button></div></header><main class="dashboard"><section class="hero panel"><div><span class="label">当前生效路由</span><div class="route-line"><span id="health-dot" class="status-dot"></span><strong id="effective">读取中</strong></div><p id="summary" class="muted">正在连接本机控制服务…</p></div><div class="mode-switch" role="group" aria-label="运行模式"><button data-policy="service">家庭服务</button><button data-policy="announcement">公告模式</button><button data-policy="auto">自动模式</button></div></section><section class="metrics"><article class="metric panel"><span>家庭上游</span><strong id="upstream">—</strong><small id="ddns">DDNS —</small></article><article class="metric panel"><span>探测延迟</span><strong id="latency">—</strong><small id="last-check">尚未检测</small></article><article class="metric panel"><span>连续状态</span><strong id="streak">—</strong><small id="last-success">最近成功 —</small></article><article class="metric panel"><span>站点证书</span><strong id="cert-days">—</strong><small id="cert-expiry">到期日 —</small></article></section><section class="grid"><article class="panel services"><div class="section-head"><div><span class="label">基础服务</span><h2>运行状态</h2></div><button class="quiet" id="check-now">立即检测</button></div><div id="services-list"></div><div class="error-box" id="last-error">暂无错误</div></article><article class="panel announcement"><div class="section-head"><div><span class="label">PUBLIC MESSAGE</span><h2>发布公告</h2></div><span class="save-state" id="save-state"></span></div><form id="announcement-form"><label>公告标题<input name="title" maxlength="100" value="服务暂时不可用" required></label><label>正文<textarea name="message" maxlength="2000" rows="6" required>家庭服务当前不可用，我们正在检查网络与应用状态。请稍后重试。</textarea></label><label>预计恢复时间<input name="eta" maxlength="100" placeholder="例如：今天 18:00 前，或留空"></label><div class="form-row"><button type="button" class="quiet" id="preview">预览</button><button type="submit">保存公告</button></div></form></article></section><section class="panel timeline"><div class="section-head"><div><span class="label">ROUTING POLICY</span><h2>切换说明</h2></div><span id="last-switch" class="muted"></span></div><div class="steps"><div><b>01</b><span>家庭服务</span><p>正常反代；遇到 502/503/504 自动显示公告。</p></div><div><b>02</b><span>公告模式</span><p>强制返回本地公告，不访问家庭设备。</p></div><div><b>03</b><span>自动模式</span><p>连续三次失败/成功后切换，含五分钟冷却。</p></div></div></section></main><dialog id="preview-dialog"><button class="dialog-close" aria-label="关闭">×</button><div class="preview-card"><div class="preview-mark">!</div><h2 id="preview-title"></h2><div id="preview-message"></div><div id="preview-eta" class="preview-eta"></div></div></dialog><div id="toast" role="status"></div><script src="/static/app.js"></script></body></html>

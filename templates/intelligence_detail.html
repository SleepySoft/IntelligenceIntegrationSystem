<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        window.IIS_BASE_PATH = {{ base_path|default('')|tojson }};
        window.IIS_SUBSYSTEM = {{ subsystem_name|default('')|tojson }};
        window.IIS_VECTOR_ENABLED = {{ vector_enabled|default(true)|tojson }};
        window.IIS_UI_PLUGIN_ENABLED = {{ ui_plugin_enabled|default(false)|tojson }};
        window.IIS_PLUGIN_ASSET_PREFIX = {{ plugin_asset_prefix|default('')|tojson }};
    </script>
    <title>情报详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/intelligence_table.css">

    <style>
        /* 针对独立页面的额外布局样式 */
        body { background-color: #f8f9fa; }
        .standalone-container {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        footer { margin-top: 40px; border-top: 1px solid #eee; padding: 20px 0; font-size: 0.9rem; color: #6c757d; }
    </style>
</head>
<body>
    <div class="standalone-container">
        <div class="mb-4 d-flex justify-content-between align-items-center">
            <a href="{{ base_path|default('') }}/intelligences" class="text-decoration-none"><i class="bi bi-arrow-left"></i> 返回情报列表</a>
            <a id="shadow-compare-link" class="btn btn-sm btn-outline-primary" style="display:none"
               href="#"><i class="bi bi-columns-gap"></i> 影子对比</a>
        </div>

        <div id="standalone-article-body">
            <div class="text-center text-muted py-5"><i class="bi bi-arrow-repeat article-spinner fs-3"></i><br>正在加载…</div>
        </div>
    </div>

    <div class="container pb-4">
        <footer>
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <div><i class="bi bi-cpu"></i> 情报整合系统</div>
                    <div class="mt-1 text-muted">© 2025 保留所有权利</div>
                </div>
                <div class="text-end">
                    <div class="fw-bold">SleepySoft</div>
                    <div class="text-muted">让数据成为洞察</div>
                </div>
            </div>
        </footer>
    </div>

    <div id="standalone-toast-container" class="article-toast-container"></div>

    <script src="/static/js/intelligence_contracts.js"></script>
    <script src="/static/js/subsystem_render_protocol.js"></script>
    {% if ui_plugin_enabled and plugin_asset_prefix %}
    <script src="{{ plugin_asset_prefix }}/ui_plugin.js"></script>
    {% endif %}
    <script src="/static/js/article_detail_renderer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const uuid = '{{ uuid }}'; // Jinja2 注入
            const container = document.getElementById('standalone-article-body');

            try {
                const resp = await fetch(`${window.IIS_BASE_PATH || ''}/api/intelligence/${encodeURIComponent(uuid)}`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const payload = await resp.json();
                const article = payload?.data || payload;

                // 1. 渲染 HTML
                container.innerHTML = ArticleDetailRenderer.generateHTML(article);
                document.title = article?.EVENT_TITLE || '情报详情';

                // 2. 绑定评分事件
                ArticleDetailRenderer.bindEvents(container, uuid, 'standalone-toast-container');

            } catch (err) {
                container.innerHTML = `<div class="alert alert-danger">加载失败：${err.message}</div>`;
            }

            // 影子对比入口：有影子数据才显示（独立请求，失败不影响正文渲染）
            try {
                const sresp = await fetch(`${window.IIS_BASE_PATH || ''}/api/intelligence/${encodeURIComponent(uuid)}/shadow`);
                if (sresp.ok) {
                    const sdata = await sresp.json();
                    if (sdata.available) {
                        const link = document.getElementById('shadow-compare-link');
                        link.href = `${window.IIS_BASE_PATH || ''}/shadow/compare/${encodeURIComponent(uuid)}`;
                        link.style.display = '';
                    }
                }
            } catch (e) { /* 无影子数据时静默 */ }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIS 运行监控</title>
    <style>
        :root {
            --bg: #0f172a; --card-bg: #1e293b; --card-border: #334155;
            --primary: #38bdf8; --success: #4ade80; --warning: #fbbf24;
            --danger: #f87171; --text: #f1f5f9; --muted: #94a3b8; --hover: #27354f;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
               margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 24px; margin: 0; }
        h2 { font-size: 17px; margin: 0 0 12px; color: var(--primary); }
        .subtitle { color: var(--muted); font-size: 13px; }
        header { display: flex; justify-content: space-between; align-items: center;
                 margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--card-border);
                 flex-wrap: wrap; gap: 12px; }
        .section { background: var(--card-bg); border: 1px solid var(--card-border);
                   border-radius: 12px; padding: 18px; margin-bottom: 20px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                 gap: 12px; margin-bottom: 12px; }
        .card { background: var(--bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; }
        .card .value { font-size: 22px; font-weight: 700; }
        .card .label { color: var(--muted); font-size: 12px; }
        .card.warn .value { color: var(--warning); }
        .card.bad .value { color: var(--danger); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--card-border); }
        th { color: var(--muted); font-weight: 500; }
        .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; }
        .tag.ok { background: rgba(74,222,128,.15); color: var(--success); }
        .tag.busy { background: rgba(251,191,36,.15); color: var(--warning); }
        .tag.bad { background: rgba(248,113,113,.15); color: var(--danger); }
        .error { color: var(--danger); font-size: 13px; padding: 8px 0; }
        .link { color: var(--primary); text-decoration: none; font-size: 13px; }
        .link:hover { text-decoration: underline; }
        .refresh-note { color: var(--muted); font-size: 12px; }
        td.num { font-variant-numeric: tabular-nums; }
        .proc-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .proc-tab { background: var(--bg); border: 1px solid var(--card-border); border-radius: 8px;
                    padding: 5px 14px; font-size: 13px; cursor: pointer; color: var(--text); }
        .proc-tab:hover { background: var(--hover); }
        .proc-tab.active { background: var(--primary); color: #0f172a; border-color: var(--primary); }
        .thread-scroll { max-height: 420px; overflow-y: auto; border: 1px solid var(--card-border);
                         border-radius: 8px; }
        .thread-scroll table th { position: sticky; top: 0; background: var(--bg); }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>运行监控</h1>
            <div class="subtitle">实时事件调度 · 持久工作流结果 · AI 客户端 · 进程与系统资源（5s 刷新）</div>
        </div>
        <div>
            <span class="refresh-note" id="refresh-note"></span>&nbsp;&nbsp;
            <a class="link" href="/post/index">← 返回首页</a>&nbsp;&nbsp;
            <a class="link" href="/control">运行控制 →</a>&nbsp;&nbsp;
            <a class="link" href="/statistics/overview">统计分析 →</a>&nbsp;&nbsp;
            <a class="link" href="/monitor/ai-client-dashboard">AI 客户端详情 →</a>
        </div>
    </header>

    <!-- Hub 状态（本次启动） -->
    <div class="section">
        <h2>Hub 事件调度（本次启动）</h2>
        <div class="subtitle" style="margin-bottom:12px">
            “已分派”表示事件已从队列取出并完成 Handler 调用，无论业务成功、拒绝或异常；它不是成功归档数量。
        </div>
        <div class="cards" id="hub-cards"></div>
        <div class="subtitle" style="margin-bottom:6px">子系统结果（本次进程生命周期）</div>
        <table id="subsystem-table"></table>
        <div class="error" id="hub-error" style="display:none"></div>
    </div>

    <!-- 持久工作流结果 -->
    <div class="section">
        <h2>工作流累计结果（持久数据库）</h2>
        <div class="subtitle" style="margin-bottom:12px">
            从采集缓存、V4 归档集合和低价值集合实时汇总，服务重启后不会清零。
        </div>
        <div class="cards" id="workflow-cards"></div>
        <table id="workflow-table"></table>
        <div class="error" id="workflow-error" style="display:none"></div>
    </div>

    <!-- AI 客户端 -->
    <div class="section">
        <h2>AI 客户端</h2>
        <div class="cards">
            <div class="card"><div class="value" id="ai-total">-</div><div class="label">客户端总数</div></div>
            <div class="card"><div class="value" id="ai-available">-</div><div class="label">空闲可用</div></div>
            <div class="card"><div class="value" id="ai-busy">-</div><div class="label">忙碌</div></div>
        </div>
        <table id="ai-table"></table>
        <div class="error" id="ai-error" style="display:none"></div>
    </div>

    <!-- 进程监控（支持多进程：本服务/爬虫/向量库等） -->
    <div class="section">
        <h2>进程监控 <span class="subtitle" id="proc-name"></span></h2>
        <div class="proc-tabs" id="proc-tabs"></div>
        <div class="cards" id="proc-cards"></div>
        <h2 style="margin-top:16px">线程（按 CPU 降序，全部）</h2>
        <div class="thread-scroll">
            <table id="thread-table"></table>
        </div>
        <div class="error" id="proc-error" style="display:none"></div>
    </div>

    <!-- 系统资源 -->
    <div class="section">
        <h2>系统资源</h2>
        <div class="cards" id="sys-cards"></div>
        <div class="error" id="sys-error" style="display:none"></div>
    </div>
</div>

<script>
function showError(id, msg) {
    const el = document.getElementById(id);
    el.style.display = msg ? '' : 'none';
    el.textContent = msg || '';
}
async function fetchJson(url) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.json();
}
function esc(s) {
    return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function metricCard(label, value, cls = '') {
    return `<div class="card ${cls}"><div class="value">${esc(value)}</div><div class="label">${esc(label)}</div></div>`;
}
function percentCard(label, value, warnAt, badAt) {
    if (value === undefined || value === null) return metricCard(label, 'N/A');
    const num = parseFloat(value);
    let cls = '';
    if (num >= badAt) cls = 'bad'; else if (num >= warnAt) cls = 'warn';
    return metricCard(label, num.toFixed(1) + '%', cls);
}
function mb(bytes) {
    return bytes === undefined || bytes === null ? 'N/A' : (bytes / 1048576).toFixed(0) + ' MB';
}

/* ---------- Hub 状态 ---------- */
async function loadHub() {
    try {
        const data = await fetchJson('/api/runtime/status');
        const runtime = data.hub?.runtime || {};
        const analysis = data.hub?.analysis || {};
        const shadow = data.hub?.shadow || {};
        const processed = runtime.processed_by_type || {};
        const terminalFailures = (processed['analysis.failed'] || 0) +
                                 (processed['archive.failed'] || 0);
        const vErr = analysis.validation_errors || 0;
        document.getElementById('hub-cards').innerHTML = [
            metricCard('事件 已发/已分派', `${runtime.emitted ?? 0} / ${runtime.processed ?? 0}`),
            metricCard('队列积压', runtime.pending_events ?? 0,
                       (runtime.pending_events ?? 0) > 100 ? 'warn' : ''),
            metricCard('在途提交', runtime.in_flight_submissions ?? 0),
            metricCard('本次归档完成', processed['archive.completed'] || 0),
            metricCard('本次分析/归档失败', terminalFailures,
                       terminalFailures > 0 ? 'bad' : ''),
            metricCard('本次入口拒绝', processed['intake.rejected'] || 0),
            metricCard('Handler 异常', runtime.handler_failures ?? 0,
                       (runtime.handler_failures ?? 0) > 0 ? 'bad' : ''),
            metricCard('AI 调用/重试', `${analysis.attempts ?? 0} / ${analysis.retries ?? 0}`),
            metricCard('校验失败', vErr, vErr > 0 ? 'warn' : ''),
            metricCard('AI 错误', (analysis.call_errors ?? 0) + (analysis.api_errors ?? 0)),
            metricCard('影子分析 记录/失败', `${shadow.recorded ?? 0} / ${shadow.failed ?? 0}`),
            metricCard('活动 Handler', runtime.active_handlers ?? 0),
        ].join('');
        const subs = data.hub?.subsystems || [];
        document.getElementById('subsystem-table').innerHTML =
            '<tr><th>子系统</th><th>归档</th><th>丢弃</th><th>错误</th></tr>' +
            subs.map(s => {
                const stats = s.stats || {};
                return `<tr><td>${esc(s.display_name || s.name)}</td><td>${stats.archived ?? 0}</td>` +
                       `<td>${stats.dropped ?? 0}</td>` +
                       `<td style="color:${(stats.error ?? 0) > 0 ? 'var(--danger)' : 'inherit'}">${stats.error ?? 0}</td></tr>`;
            }).join('');
        showError('hub-error', null);

        const outcomes = data.hub?.workflow_outcomes || [];
        const available = outcomes.filter(item => !item.error);
        const sum = key => available.reduce((total, item) => total + (item[key] || 0), 0);
        document.getElementById('workflow-cards').innerHTML = [
            metricCard('缓存接收记录', sum('received')),
            metricCard('待处理', sum('pending'), sum('pending') > 0 ? 'warn' : ''),
            metricCard('已归档', sum('archived')),
            metricCard('无价值', sum('low_value')),
            metricCard('彻底失败', sum('failed'), sum('failed') > 0 ? 'bad' : ''),
            metricCard('敏感内容', sum('sensitive'), sum('sensitive') > 0 ? 'warn' : ''),
            metricCard('重复提交', sum('duplicated')),
            metricCard('主动弃用', sum('deprecated')),
        ].join('');
        document.getElementById('workflow-table').innerHTML =
            '<tr><th>子系统</th><th>接收</th><th>待处理</th><th>归档</th><th>无价值</th>' +
            '<th>失败</th><th>敏感</th><th>重复</th><th>待重试</th><th>弃用</th></tr>' +
            outcomes.map(item => item.error
                ? `<tr><td>${esc(item.display_name || item.name)}</td><td colspan="9" style="color:var(--danger)">${esc(item.error)}</td></tr>`
                : `<tr><td>${esc(item.display_name || item.name)}</td>` +
                  `<td>${item.received || 0}</td><td>${item.pending || 0}</td>` +
                  `<td>${item.archived || 0}</td><td>${item.low_value || 0}</td>` +
                  `<td>${item.failed || 0}</td><td>${item.sensitive || 0}</td>` +
                  `<td>${item.duplicated || 0}</td><td>${item.retry || 0}</td>` +
                  `<td>${item.deprecated || 0}</td></tr>`).join('');
        showError('workflow-error', outcomes.some(item => item.error)
            ? '部分子系统累计结果查询失败，详见表格。' : null);
    } catch (e) { showError('hub-error', `加载失败: ${e.message}`); }
}

/* ---------- AI 客户端 ---------- */
async function loadAi() {
    try {
        const data = await fetchJson('/monitor/ai-client-dashboard/api/overview');
        const clients = data.clients || [];
        const available = clients.filter(c =>
            (c.state?.status || '').toLowerCase() === 'available' && !c.state?.is_busy).length;
        const busy = clients.filter(c => c.state?.is_busy).length;
        document.getElementById('ai-total').textContent = clients.length;
        document.getElementById('ai-available').textContent = available;
        document.getElementById('ai-busy').textContent = busy;
        document.getElementById('ai-table').innerHTML =
            '<tr><th>客户端</th><th>当前模型</th><th>状态</th></tr>' +
            clients.map(c => {
                const st = c.state || {};
                const busyTag = st.is_busy ? '<span class="tag busy">忙碌</span>'
                                           : '<span class="tag ok">空闲</span>';
                const status = (st.status || 'unknown').toLowerCase();
                const statusTag = status === 'available'
                    ? `<span class="tag ok">${esc(status)}</span>`
                    : `<span class="tag bad">${esc(status)}</span>`;
                return `<tr><td>${esc(c.meta?.name)}</td><td>${esc(c.meta?.current_model)}</td>` +
                       `<td>${statusTag} ${busyTag}</td></tr>`;
            }).join('');
        showError('ai-error', null);
    } catch (e) { showError('ai-error', `加载失败: ${e.message}`); }
}

/* ---------- 进程监控（多进程） ---------- */
let selectedPid = null;

async function loadProcess() {
    try {
        const processes = await fetchJson('/monitor/api/processes');
        if (!processes.length) {
            showError('proc-error', '没有被监控的进程');
            return;
        }
        // 保持用户选择；默认选中第一个（启动装配首先注册本服务进程）。
        if (!processes.some(p => p.pid === selectedPid)) selectedPid = processes[0].pid;
        document.getElementById('proc-tabs').innerHTML = '';
        const tabs = document.getElementById('proc-tabs');
        for (const p of processes) {
            const tab = document.createElement('button');
            tab.className = 'proc-tab' + (p.pid === selectedPid ? ' active' : '');
            tab.textContent = `${p.name || 'process'} (${p.pid})`;
            tab.onclick = () => { selectedPid = p.pid; loadProcess(); };
            tabs.appendChild(tab);
        }
        const [proc, threads] = await Promise.all([
            fetchJson(`/monitor/api/process/${selectedPid}`),
            fetchJson(`/monitor/api/threads/${selectedPid}`),
        ]);
        document.getElementById('proc-name').textContent =
            `PID ${proc.pid} · ${proc.name || ''} · ${proc.status || ''}`;
        document.getElementById('proc-cards').innerHTML = [
            percentCard('进程 CPU', proc.cpu_percent, 50, 80),
            metricCard('进程内存 (RSS)', mb(proc.memory_info?.rss)),
            percentCard('进程内存占比', proc.memory_percent, 20, 40),
            metricCard('句柄数', proc.num_handles ?? 'N/A',
                       (proc.num_handles ?? 0) > 5000 ? 'warn' : ''),
            metricCard('线程数', proc.num_threads ?? '-'),
            metricCard('网络连接数', proc.connections ?? 'N/A'),
        ].join('');
        const rows = threads || [];
        document.getElementById('thread-table').innerHTML =
            '<tr><th>线程名</th><th>TID</th><th>CPU %</th><th>用户态(s)</th><th>内核态(s)</th></tr>' +
            rows.map(t =>
                `<tr><td>${esc(t.name)}</td><td class="num">${t.tid}</td>` +
                `<td class="num">${t.cpu_percent.toFixed(2)}</td>` +
                `<td class="num">${t.user_time.toFixed(1)}</td>` +
                `<td class="num">${t.system_time.toFixed(1)}</td></tr>`).join('');
        showError('proc-error', null);
    } catch (e) { showError('proc-error', `加载失败: ${e.message}`); }
}

/* ---------- 系统资源 ---------- */
async function loadSystem() {
    try {
        const sys = await fetchJson('/monitor/api/system');
        document.getElementById('sys-cards').innerHTML = [
            percentCard('CPU', sys.cpu?.percent, 70, 90),
            metricCard('CPU 核心', `${sys.cpu?.cores ?? '?'} 物理 / ${sys.cpu?.logical_cores ?? '?'} 逻辑`),
            percentCard('内存', sys.memory?.percent, 75, 90),
            metricCard('内存 已用/总量',
                `${mb(sys.memory?.used)} / ${mb(sys.memory?.total)}`),
            percentCard('磁盘', sys.disk?.usage?.percent, 80, 95),
            percentCard('交换区', sys.swap?.percent, 50, 80),
            metricCard('网络连接数', sys.network?.connections ?? 'N/A'),
        ].join('');
        showError('sys-error', null);
    } catch (e) { showError('sys-error', `加载失败: ${e.message}`); }
}

async function refreshAll() {
    await Promise.allSettled([loadHub(), loadAi(), loadProcess(), loadSystem()]);
    document.getElementById('refresh-note').textContent =
        '上次刷新 ' + new Date().toLocaleTimeString();
}
refreshAll();
setInterval(refreshAll, 5000);
</script>
</body>
</html>

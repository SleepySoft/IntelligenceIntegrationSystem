<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        window.IIS_BASE_PATH = {{ base_path|default('')|tojson }};
        window.IIS_SUBSYSTEM = {{ subsystem_name|default('')|tojson }};
        window.IIS_VECTOR_ENABLED = {{ vector_enabled|default(true)|tojson }};
        window.IIS_UI_PLUGIN_ENABLED = {{ ui_plugin_enabled|default(false)|tojson }};
        window.IIS_PLUGIN_ASSET_PREFIX = {{ plugin_asset_prefix|default('')|tojson }};
        window.IIS_PUBLIC_MODE = {{ public_mode|default(false)|tojson }};
        window.IIS_PUBLIC_LIMITS = {{ public_limits|default({})|tojson }};
    </script>
    <title>情报列表 · IIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/intelligence_table.css">
</head>
<body>

    <div class="article-list">
        <div class="controls-container">
            <label>
                最低评分：
                <select id="threshold-select">
                    <option value="0">全部（0+）</option>
                    <option value="4">待观察（&gt; 4）</option>
                    <option value="6" selected>良好（&gt; 6）</option>
                    <option value="8">高价值（&gt; 8）</option>
                </select>
            </label>

            <label>
                每页数量：
                <select id="count-select">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </label>

            <label>
                排序:
                <select id="sort-select">
                    <option value="archived_at" selected>归档时间</option>
                    <option value="content_time">内容时间</option>
                </select>
            </label>

            <button id="refresh-btn" class="refresh-btn" title="刷新">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>

        <h1>情报列表</h1>

        <div id="pagination-top" class="pagination-container"></div>

        <div id="article-list-container">
            </div>

        <div id="pagination-bottom" class="pagination-container"></div>
    </div>
    <script src="/static/js/intelligence_contracts.js"></script>
    <script src="/static/js/subsystem_render_protocol.js"></script>
    {% if ui_plugin_enabled and plugin_asset_prefix %}
    <script src="{{ plugin_asset_prefix }}/ui_plugin.js"></script>
    {% endif %}
    <script src="/static/js/article_detail_renderer.js"></script>
    <script src="/static/js/intelligence_table_renderer.js"></script>
    <script src="/static/js/article_modal_manager.js"></script>
    <script src="/static/js/intelligence_list.js"></script>
</body>
</html>

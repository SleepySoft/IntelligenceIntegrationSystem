<!DOCTYPE html>
<html lang="{{ ui_locale|default('zh-CN') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        window.IIS_BASE_PATH = {{ base_path|default('')|tojson }};
        window.IIS_SUBSYSTEM = {{ subsystem_name|default('')|tojson }};
        window.IIS_VECTOR_ENABLED = {{ vector_enabled|default(true)|tojson }};
        window.IIS_UI_PLUGIN_ENABLED = {{ ui_plugin_enabled|default(false)|tojson }};
        window.IIS_PLUGIN_ASSET_PREFIX = {{ plugin_asset_prefix|default('')|tojson }};
        window.IIS_PUBLIC_MODE = {{ public_mode|default(false)|tojson }};
        window.IIS_PUBLIC_LIMITS = {{ public_limits|default({})|tojson }};
        window.IIS_UI_LOCALE = {{ ui_locale|default('zh-CN')|tojson }};
        window.IIS_I18N_MESSAGES = {
            published: {{ _('Published')|tojson }},
            collected: {{ _('Collected')|tojson }},
            archived: {{ _('Archived')|tojson }},
            content_time_basis: {{ _('Content-time sort basis')|tojson }},
            archived_time_basis: {{ _('Archive-time sort basis')|tojson }},
            loading_intelligence: {{ _('Loading intelligence…')|tojson }},
            loading_failed: {{ _('Loading failed: {message}')|tojson }},
            no_time_information: {{ _('No time information')|tojson }},
            unknown_uuid: {{ _('Unknown UUID')|tojson }},
            unknown_source: {{ _('Unknown source')|tojson }},
            uncategorized: {{ _('Uncategorized')|tojson }},
            total_score: {{ _('Total score:')|tojson }},
            service: {{ _('Service:')|tojson }},
            model: {{ _('Model:')|tojson }},
            view_prompt: {{ _('View Prompt v{version}')|tojson }},
            untitled: {{ _('Untitled')|tojson }},
            source: {{ _('Source:')|tojson }},
            no_summary: {{ _('No summary available')|tojson }},
            no_intelligence: {{ _('No intelligence found')|tojson }},
            first_page: {{ _('First')|tojson }},
            previous_page: {{ _('Previous')|tojson }},
            next_page: {{ _('Next')|tojson }},
            pagination_summary: {{ _('{page} / {pages} ({total} total)')|tojson }},
            prompt_viewer: {{ _('Prompt viewer')|tojson }},
            copy: {{ _('Copy')|tojson }},
            close: {{ _('Close')|tojson }},
            loading: {{ _('Loading…')|tojson }},
            copied: {{ _('Copied')|tojson }},
            loading_prompt: {{ _('Loading Prompt v{version}…')|tojson }},
            copy_prompt_hint: {{ _('Tip: select “Copy” to copy the complete Prompt.')|tojson }},
            prompt_load_failed: {{ _('Prompt v{version} failed to load: {message}')|tojson }},
            vector_sort_title: {{ _('Vector results are sorted by similarity')|tojson }},
            article_loading: {{ _('Loading…')|tojson }},
            copy_link: {{ _('Copy link')|tojson }},
            open_new_tab: {{ _('Open in a new tab')|tojson }},
            unauthorized_article: {{ _('You are not authorized to view this intelligence')|tojson }},
            link_copied: {{ _('Link copied')|tojson }},
            copy_failed: {{ _('Copy failed')|tojson }},
            intelligence_details: {{ _('Intelligence details')|tojson }},
            load_failed: {{ _('Loading failed')|tojson }}
        };
    </script>
    <title>{{ _('Intelligence list · IIS') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/intelligence_table.css">
</head>
<body>

    <div class="article-list">
        <div class="controls-container">
            <label>
                {{ _('Minimum score:') }}
                <select id="threshold-select">
                    <option value="0">{{ _('All (0+)') }}</option>
                    <option value="4">{{ _('Watch (> 4)') }}</option>
                    <option value="6" selected>{{ _('Good (> 6)') }}</option>
                    <option value="8">{{ _('High value (> 8)') }}</option>
                </select>
            </label>

            <label>
                {{ _('Items per page:') }}
                <select id="count-select">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </label>

            <label>
                {{ _('Sort by:') }}
                <select id="sort-select">
                    <option value="archived_at" selected>{{ _('Archive time') }}</option>
                    <option value="content_time">{{ _('Content time') }}</option>
                </select>
            </label>

            <button id="refresh-btn" class="refresh-btn" title="{{ _('Refresh') }}" aria-label="{{ _('Refresh') }}">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>

        <h1>{{ _('Intelligence list') }}</h1>

        <div id="pagination-top" class="pagination-container"></div>

        <div id="article-list-container">
            </div>

        <div id="pagination-bottom" class="pagination-container"></div>
    </div>
    <script src="/static/js/iis_i18n.js"></script>
    <script src="/static/js/intelligence_contracts.js"></script>
    <script src="/static/js/subsystem_render_protocol.js"></script>
    {% if ui_plugin_enabled and plugin_asset_prefix %}
    <script src="{{ plugin_asset_prefix }}/ui_plugin.js"></script>
    {% endif %}
    <script src="/static/js/article_detail_renderer.js"></script>
    <script src="/static/js/intelligence_table_renderer.js"></script>
    <script src="/static/js/article_modal_manager.js"></script>
    <script src="/static/js/intelligence_list.js"></script>
</body>
</html>

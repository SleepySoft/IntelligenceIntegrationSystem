# 位于 sleepysoft.org 的 HTTPS server 上下文。
access_log /var/log/iis-traffic/pageviews.log iis_pageview if=$iis_log_pageview;

location = /_traffic_auth {
    internal;
    proxy_pass http://home_backend/auth_check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location = /ops/traffic {
    return 302 /ops/traffic/;
}

location = /ops/traffic/ {
    auth_request /_traffic_auth;
    error_page 401 = @traffic_login;
    root /var/www/traffic-analytics;
    try_files /simple.html =404;
    default_type text/html;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /ops/traffic/data.json {
    auth_request /_traffic_auth;
    error_page 401 = @traffic_login;
    root /var/www/traffic-analytics;
    try_files /summary.json =404;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /ops/traffic/raw/ {
    auth_request /_traffic_auth;
    error_page 401 = @traffic_login;
    root /var/www/traffic-analytics;
    try_files /raw.html =404;
    default_type text/html;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location @traffic_login {
    return 302 /login?next=/ops/traffic/;
}

# 位于 Nginx http 上下文。专用日志只记录 HTML 页面导航，排除 API、
# 静态资源和运维端点；URL 与来源均去掉 query，避免搜索条件进入访问统计。
log_format iis_pageview
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$iis_safe_referer" "$http_user_agent" '
    '$request_time $host $http_cf_ipcountry';

map $http_referer $iis_safe_referer {
    default "-";
    ~^(?<iis_referrer_without_query>https?://[^?#]+) $iis_referrer_without_query;
}

map "$request_method:$status:$sent_http_content_type" $iis_html_candidate {
    default 0;
    ~^(GET|HEAD):[2345][0-9][0-9]:text/html 1;
}

map $uri $iis_analytics_path {
    default 1;
    ~^/ops/traffic(?:/|$) 0;
    ~^/ddns/update$ 0;
    ~^/administrator-manager-api(?:/|$) 0;
    ~^/maintenance/ping$ 0;
    ~^/auth_check$ 0;
}

map "$iis_html_candidate:$iis_analytics_path" $iis_log_pageview {
    default 0;
    "1:1" 1;
}

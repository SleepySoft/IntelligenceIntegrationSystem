<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IIS 网站访问</title>
<style>
:root{color-scheme:dark;--bg:#0f172a;--panel:#172033;--soft:#202c42;--line:#33435d;--text:#edf3fb;--muted:#9baac0;--blue:#4f8cff;--green:#37c978;--amber:#f7b84b;--red:#f06b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}.shell{max-width:1380px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}h1{margin:0;font-size:25px}h2{font-size:16px;margin:0 0 12px}a{color:#8db4ff}.muted{color:var(--muted)}.ranges{display:flex;gap:7px}.ranges button{border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--text);padding:7px 12px;cursor:pointer}.ranges button.active{background:var(--blue);border-color:var(--blue)}.cards{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.card{padding:14px}.card b{display:block;font-size:25px}.card span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px}.panel{padding:16px;min-width:0}.wide{grid-column:1/-1}.chart{height:230px;display:flex;align-items:end;gap:5px;padding-top:15px;overflow-x:auto}.day{height:100%;min-width:32px;flex:1;display:grid;grid-template-rows:1fr auto;gap:6px}.bars{display:flex;align-items:end;justify-content:center;gap:3px;height:100%;border-bottom:1px solid var(--line)}.bar{width:10px;min-height:2px;border-radius:4px 4px 0 0;background:var(--blue)}.bar.visitor{background:var(--green)}.day small{color:var(--muted);font-size:10px;text-align:center;white-space:nowrap}.legend{display:flex;gap:14px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(80px,1fr) 3fr 48px;gap:9px;align-items:center}.row label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:inherit}.row em{text-align:right;color:var(--muted);font-style:normal}.status{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--soft)}.status span{display:grid;place-items:center;min-width:2px;font-size:11px;overflow:hidden}.error{padding:20px;color:var(--red)}footer{margin-top:14px;color:var(--muted);font-size:12px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:480px){.shell{padding:12px}.cards{grid-template-columns:1fr 1fr}.card b{font-size:21px}}
</style>
</head>
<body><main class="shell">
<header><div><h1>网站访问</h1><div class="muted" id="updated">正在读取统计…</div></div><div><div class="ranges"><button data-days="1">今日</button><button data-days="7" class="active">近7天</button><button data-days="30">近30天</button></div><div style="text-align:right;margin-top:7px"><a href="/ops/traffic/raw/">高级报告</a> · <a href="/post/index">管理主页</a></div></div></header>
<section class="cards"><div class="card"><b id="visitors">-</b><span>访客（按日近似）</span></div><div class="card"><b id="views">-</b><span>页面浏览</span></div><div class="card"><b id="perVisitor">-</b><span>人均浏览页数</span></div><div class="card"><b id="crawlers">-</b><span>爬虫页面请求</span></div><div class="card"><b id="errors">-</b><span>真人访问错误率</span></div><div class="card"><b id="p95">-</b><span>P95整体响应</span></div></section>
<section class="grid">
 <div class="panel wide"><h2>访问趋势</h2><div class="legend"><span><i style="background:var(--blue)"></i>浏览量</span><span><i style="background:var(--green)"></i>访客</span></div><div class="chart" id="trend"></div></div>
 <div class="panel"><h2>热门页面</h2><div class="rows" id="pages"></div></div>
 <div class="panel"><h2>访问来源</h2><div class="rows" id="sources"></div></div>
 <div class="panel"><h2>国家或地区</h2><div class="rows" id="countries"></div></div>
 <div class="panel"><h2>设备与浏览器</h2><div class="rows" id="devices"></div><h2 style="margin-top:18px">浏览器</h2><div class="rows" id="browsers"></div></div>
 <div class="panel wide"><h2>HTTP 状态</h2><div class="status" id="statuses"></div><div class="muted" id="latency" style="margin-top:10px"></div></div>
</section>
<div class="error" id="error" hidden></div><footer id="definitions"></footer>
</main><script>
let payload=null,selected='7';const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString();
function rows(id,items,color='#4f8cff',label=v=>v){const box=$(id),max=Math.max(1,...(items||[]).map(x=>x[1]));box.innerHTML=(items||[]).map(([name,count])=>`<div class="row" title="${esc(name)}"><label>${esc(label(name))}</label><div class="track"><div class="fill" style="width:${count/max*100}%;background:${color}"></div></div><em>${fmt(count)}</em></div>`).join('')||'<span class="muted">暂无数据</span>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function percent(v){return `${(Number(v||0)*100).toFixed(1)}%`}function region(code){if(code==='未知')return code;try{return new Intl.DisplayNames(['zh-CN'],{type:'region'}).of(code)||code}catch{return code}}
function render(){const d=payload.ranges[selected];$('visitors').textContent=fmt(d.visitors);$('views').textContent=fmt(d.pageviews);$('perVisitor').textContent=d.pages_per_visitor.toFixed(2);$('crawlers').textContent=fmt(d.crawler_requests);$('errors').textContent=percent(d.error_rate);$('p95').textContent=`${fmt(d.latency_ms.p95)} ms`;
 const max=Math.max(1,...d.daily.flatMap(x=>[x.pageviews,x.visitors]));$('trend').innerHTML=d.daily.map(x=>`<div class="day" title="${x.date}：${x.pageviews} 次浏览，${x.visitors} 位访客"><div class="bars"><i class="bar" style="height:${x.pageviews/max*100}%"></i><i class="bar visitor" style="height:${x.visitors/max*100}%"></i></div><small>${x.date.slice(5)}</small></div>`).join('')||'<span class="muted">暂无数据</span>';
 rows('pages',d.top_pages);rows('sources',d.sources,'#37c978');rows('countries',d.countries,'#f7b84b',region);rows('devices',d.devices,'#a779e9');rows('browsers',d.browsers,'#5bc0c9');
 const total=Math.max(1,d.status_codes.reduce((n,x)=>n+x[1],0));$('statuses').innerHTML=d.status_codes.map(([code,count])=>`<span title="HTTP ${code}：${count}" style="width:${count/total*100}%;background:${code[0]==='2'?'#37c978':code[0]==='3'?'#4f8cff':code[0]==='4'?'#f7b84b':'#f06b6b'}">${count/total>.08?`${code} ${count}`:''}</span>`).join('');$('latency').textContent=`平均 ${d.latency_ms.average} ms · P50 ${d.latency_ms.p50} ms · P95 ${d.latency_ms.p95} ms`}
document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{selected=b.dataset.days;document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('active',x===b));render()});
fetch('/ops/traffic/data.json',{credentials:'same-origin'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(data=>{payload=data;$('updated').textContent=`更新于 ${new Date(data.generated_at).toLocaleString()} · 数据始于 ${data.available_since?new Date(data.available_since).toLocaleString():'暂无'}`;$('definitions').textContent=`口径：${data.definitions.visitors}；${data.definitions.pageviews}。爬虫识别为启发式结果。`;render()}).catch(e=>{$('error').hidden=false;$('error').textContent=`统计加载失败：${e.message}`;$('updated').textContent='暂时无法读取统计'});
</script></body></html>

# =========================
#  NGINX (Windows) Main Config - Modified
# =========================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 日志格式
    log_format goaccess_ext
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time '
        'ua="$upstream_addr" us="$upstream_status" urt="$upstream_response_time" '
        'xff="$http_x_forwarded_for" reqid="$request_id"';

    access_log  C:/nginx/logs/access_main.log  goaccess_ext;
    error_log   C:/nginx/logs/error.log  warn;

	set_real_ip_from 107.175.172.145;

	# 从这个头里取真实 IP
	real_ip_header X-Forwarded-For;

	# 如果有多层代理，递归搜索
	real_ip_recursive on;

	# 关闭绝对路径重定向
    # 让 Nginx 返回 "Location: /foo/" 而不是 "Location: https://host:8443/foo/"
    absolute_redirect off;

    # 告诉 Nginx 不要把端口号加到重定向里
    port_in_redirect off;

    client_max_body_size 50m;

    proxy_set_header Host              $host;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # ================
    # 1) HTTP -> HTTPS 重定向
    # ================
    server {
        listen       80;
        server_name  sleepysoft.asuscomm.com;

        # 【注意】这里必须保持 25000
        # 浏览器在公网，它只能看到路由器的外部端口 (25000)
        return 301 https://$host:25000$request_uri;
    }

    # ================
    # 2) HTTPS 主站
    # ================
    server {
        # 【变更 1】本地监听 8443 (路由器会将外部 25000 -> 内部 8443)
        listen       8443 ssl;
        server_name  sleepysoft.asuscomm.com sleepysoft.org www.sleepysoft.org impart.today www.impart.today 127.0.0.1 localhost;

        ssl_certificate      C:/nginx/conf/ssl/server.crt;
        ssl_certificate_key  C:/nginx/conf/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # -------------------------
        # 主服务：/ -> 127.0.0.1:5000
        # -------------------------
        location / {
            access_log C:/nginx/logs/access_main.log goaccess_ext;
            proxy_pass http://127.0.0.1:5000;
            proxy_read_timeout  60s;
            proxy_connect_timeout 5s;
        }

        # -------------------------
        # 鉴权接口 (Internal)
        # -------------------------
        location = /_auth_check {
            internal;
            proxy_pass http://127.0.0.1:5000/auth_check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        # 未登录跳转
        location @login {
            return 302 /login?next=$scheme://$host$request_uri;
        }

        # -------------------------
        # 子服务 1: Crawl Monitor -> 8002
        # -------------------------
        location /crawl_monitor/ {
            access_log C:/nginx/logs/access_crawl_monitor.log goaccess_ext;

            auth_request /_auth_check;
            error_page 401 = @login;
            error_page 403 = @login;

            proxy_set_header X-Forwarded-Prefix /crawl_monitor;
            proxy_pass http://127.0.0.1:8002/;
        }

        # -------------------------
        # 【变更 2】子服务 2: VectorDB -> 8001
        # -------------------------
        location /vectordb/ {
            # 独立日志，方便排查
            access_log C:/nginx/logs/access_vectordb.log goaccess_ext;

            # 开启鉴权
            auth_request /_auth_check;
            error_page 401 = @login;
            error_page 403 = @login;

            # 告诉后端它在 /vectordb 下运行（防止重定向错误）
            proxy_set_header X-Forwarded-Prefix /vectordb;

            # 转发到 8001，末尾带 / 以剥离路径
            # 请求 /vectordb/api -> http://127.0.0.1:8001/api
            proxy_pass http://127.0.0.1:8001/;

            proxy_read_timeout  60s;
            proxy_connect_timeout 5s;
        }

    } # end server 8443
}
